# Defaults are production-safe; local values come from infrastructure/.env (docker compose).
spring:
  application:
    name: crm
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    # The application login: EXECUTE on schema `app` only (ADR-0002).
    url: ${CRM_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=crm;encrypt=true;trustServerCertificate=true}
    username: ${CRM_DB_APP_USER:crm_app}
    password: ${CRM_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${CRM_DB_POOL_SIZE:30}
      minimum-idle: ${CRM_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${CRM_DB_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    # Migrations run only in CRM_MODE=migrate (application-migrate.yml) with the migrator login.
    enabled: false

  servlet:
    multipart:
      # One file up to 20 MB (the procedure's limit); a request with up to 10 of them and the form fields.
      max-file-size: 20MB
      max-request-size: 210MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${CRM_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${CRM_COOKIE_SECURE:false}

crm:
  auth:
    max-failed-logins: ${CRM_LOGIN_MAX_FAILED:5}
    lock-minutes: ${CRM_LOGIN_LOCK_MINUTES:15}
    admin-login: ${CRM_ADMIN_LOGIN:}
    admin-password: ${CRM_ADMIN_PASSWORD:}
    # Local development only: POST /api/auth/dev-login logs in as any active user without a password.
    dev-login: ${CRM_DEV_LOGIN:false}
  desk:
    public-reports-per-minute: ${CRM_DESK_PUBLIC_REPORTS_PER_MINUTE:30}
  # Desk attachments (ADR-0009): a private S3 bucket, path-style URLs (RustFS locally).
  storage:
    endpoint: ${CRM_S3_ENDPOINT:http://localhost:9000}
    region: ${CRM_S3_REGION:us-east-1}
    access-key: ${CRM_S3_ACCESS_KEY:}
    secret-key: ${CRM_S3_SECRET_KEY:}
    bucket: ${CRM_S3_BUCKET:crm-attachments}
  # The company on the offer PDFs (ADR-0013).
  offer:
    company-name: ${CRM_OFFER_COMPANY_NAME:Halycon Inc.}
    company-address: ${CRM_OFFER_COMPANY_ADDRESS:ul. Obsydianowa 12, 00-950 Warszawa}
    company-phone: ${CRM_OFFER_COMPANY_PHONE:+48 22 100 20 30}
    company-email: ${CRM_OFFER_COMPANY_EMAIL:oferty@halycon.example}
    company-website: ${CRM_OFFER_COMPANY_WEBSITE:halycon.example}
    company-tax-id: ${CRM_OFFER_COMPANY_TAX_ID:NIP 525-000-00-00}
  # The application reports on itself (ADR-0012): HTTP answers and the log, written from bounded queues.
  monitoring:
    enabled: ${CRM_MONITORING_ENABLED:true}
    queue-capacity: ${CRM_MONITORING_QUEUE_CAPACITY:10000}
    flush-interval: ${CRM_MONITORING_FLUSH_INTERVAL:2s}
    write-batch-size: ${CRM_MONITORING_WRITE_BATCH_SIZE:500}
    retention: ${CRM_MONITORING_RETENTION:14d}
    cleanup-interval: ${CRM_MONITORING_CLEANUP_INTERVAL:1h}
    cleanup-batch-size: ${CRM_MONITORING_CLEANUP_BATCH_SIZE:5000}
    log-level: ${CRM_MONITORING_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: database,storage
  health:
    db:
      # Replaced by DatabaseHealthIndicator (EXEC app.health_ping).
      enabled: false

springdoc:
  swagger-ui:
    enabled: ${CRM_SWAGGER_UI:true}
